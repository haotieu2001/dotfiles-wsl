<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
  <title id="t">dotfiles-wsl architecture</title>
  <desc id="d">One repo drives two sides. home-manager switch builds everything inside WSL2 Ubuntu: CLI tools, herdr, live-symlinked config, and per-project devshells loaded by direnv. The bootstrap and rebuild scripts push across the WSL/Windows boundary: the Hack Nerd Font on every rebuild, and the Windows Terminal colour scheme once at install. Windows Terminal attaches back to herdr.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0616"/>
      <stop offset="1" stop-color="#070310"/>
    </linearGradient>
    <linearGradient id="srcfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22123A"/>
      <stop offset="1" stop-color="#170C28"/>
    </linearGradient>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C77DFF"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2FE0C4"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7BA6FF"/>
    </marker>
  </defs>

  <style>
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 14.5px; font-weight: 700; fill: #EDE7FF; }
    .sub   { font-size: 11px;   fill: #9B7FC4; }
    .hdr   { font-size: 13px;   font-weight: 700; letter-spacing: .09em; }
    .hsub  { font-size: 10.5px; fill: #6E5A90; }
    .lbl   { font-size: 10.5px; fill: #A98FD0; }
    .cap   { font-size: 11px;   fill: #7A64A0; font-style: italic; }
    .box   { fill: #150C24; stroke: #34204D; stroke-width: 1.25; }
  </style>

  <rect x="0" y="0" width="960" height="580" rx="16" fill="url(#bg)" stroke="#2A1A3E"/>

  <!-- ── source of truth ───────────────────────────────────────────── -->
  <rect x="250" y="28" width="460" height="72" rx="12" fill="url(#srcfill)" stroke="#C77DFF" stroke-width="1.5"/>
  <text class="mono" x="480" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#EDE7FF">dotfiles-wsl</text>
  <text class="mono" x="480" y="82" text-anchor="middle" font-size="12" fill="#B394E0">flake.nix · home.nix · windows/ · templates/</text>

  <!-- flows out of the repo; labels sit beside the arrowheads, not over the runs -->
  <path d="M420,100 V132 H330 V163" fill="none" stroke="#C77DFF" stroke-width="1.6" marker-end="url(#ap)"/>
  <text class="sans lbl" x="320" y="158" text-anchor="end">home-manager switch</text>

  <path d="M540,100 V132 H800 V163" fill="none" stroke="#C77DFF" stroke-width="1.6" marker-end="url(#ap)"/>
  <text class="sans lbl" x="790" y="158" text-anchor="end">bootstrap.sh · rebuild.sh</text>

  <!-- ── the boundary ──────────────────────────────────────────────── -->
  <line x1="640" y1="186" x2="640" y2="548" stroke="#4A3468" stroke-width="1.25" stroke-dasharray="5 6"/>

  <!-- ── WSL panel ─────────────────────────────────────────────────── -->
  <rect x="28" y="170" width="600" height="370" rx="12" fill="#0B0518" stroke="#2A1A3E"/>
  <text class="sans hdr" x="48" y="200" fill="#2FE0C4">WSL2 UBUNTU</text>
  <text class="sans hsub" x="48" y="218">everything Nix-managed, pinned by flake.lock</text>

  <rect class="box" x="48" y="234" width="176" height="84" rx="10"/>
  <text class="mono title" x="136" y="262" text-anchor="middle">CLI tools</text>
  <text class="mono sub" x="136" y="282" text-anchor="middle">nvim · zsh · git · rg</text>
  <text class="mono sub" x="136" y="302" text-anchor="middle">node 24 · uv · direnv</text>

  <rect class="box" x="240" y="234" width="160" height="84" rx="10"/>
  <text class="mono title" x="320" y="262" text-anchor="middle">herdr</text>
  <text class="mono sub" x="320" y="282" text-anchor="middle">tabs · panes</text>
  <text class="mono sub" x="320" y="302" text-anchor="middle">detachable sessions</text>

  <rect class="box" x="416" y="234" width="196" height="84" rx="10"/>
  <text class="mono title" x="514" y="262" text-anchor="middle">home/ live config</text>
  <text class="mono sub" x="514" y="282" text-anchor="middle">nvim · herdr · AGENTS.md</text>
  <text class="mono sub" x="514" y="302" text-anchor="middle" fill="#2FE0C4">edit it, no rebuild</text>

  <path d="M136,318 V365" fill="none" stroke="#2FE0C4" stroke-width="1.5" marker-end="url(#at)"/>
  <text class="sans lbl" x="152" y="346" fill="#2FE0C4">direnv, on cd</text>

  <rect class="box" x="48" y="372" width="564" height="92" rx="10" stroke="#3D2A5A"/>
  <text class="mono title" x="330" y="400" text-anchor="middle">your projects</text>
  <text class="mono sub" x="330" y="420" text-anchor="middle">flake.nix + .envrc, one per repo</text>
  <text class="mono sub" x="330" y="440" text-anchor="middle">python 3.12 · node 20 · whatever that repo pins</text>

  <text class="sans cap" x="330" y="492" text-anchor="middle">cd in, the toolchain appears · cd out, it is gone</text>

  <!-- ── Windows panel ─────────────────────────────────────────────── -->
  <rect x="668" y="170" width="264" height="370" rx="12" fill="#0B0518" stroke="#2A1A3E"/>
  <text class="sans hdr" x="688" y="200" fill="#7BA6FF">WINDOWS HOST</text>
  <text class="sans hsub" x="688" y="218">Nix cannot reach these</text>

  <rect class="box" x="688" y="234" width="224" height="84" rx="10"/>
  <text class="mono title" x="800" y="262" text-anchor="middle">Hack Nerd Font</text>
  <text class="mono sub" x="800" y="282" text-anchor="middle">straight from the Nix store</text>
  <text class="mono sub" x="800" y="302" text-anchor="middle" fill="#2FE0C4">re-pushed every rebuild</text>

  <rect class="box" x="688" y="372" width="224" height="92" rx="10"/>
  <text class="mono title" x="800" y="400" text-anchor="middle">Windows Terminal</text>
  <text class="mono sub" x="800" y="420" text-anchor="middle">blackpanther scheme</text>
  <text class="mono sub" x="800" y="440" text-anchor="middle" fill="#FFC42E">seeded once, then yours</text>

  <text class="sans cap" x="800" y="492" text-anchor="middle">taste, not correctness</text>

  <!-- terminal attaches back to the multiplexer -->
  <path d="M688,418 H658 V348 H320 V323" fill="none" stroke="#7BA6FF" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ab)"/>
  <text class="sans lbl" x="470" y="340" text-anchor="middle" fill="#7BA6FF">attaches to</text>
</svg>
